name: python-tests

on:
  push:
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yml'
      - 'requirements.txt'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pytest python/tests
