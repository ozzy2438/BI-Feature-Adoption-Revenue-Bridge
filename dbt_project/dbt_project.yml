name: feature_adoption_revenue_bridge
version: 1.0.0
config-version: 2
profile: feature_adoption_revenue_bridge

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  raw_dataset: "{{ env_var('BQ_RAW_DATASET', 'raw_bridge') }}"
  analytics_dataset: "{{ env_var('BQ_ANALYTICS_DATASET', 'analytics_bridge') }}"
  attribution_window_days: 60

models:
  feature_adoption_revenue_bridge:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
